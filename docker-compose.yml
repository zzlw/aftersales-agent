services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
      POSTGRES_DB: aftersales
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d aftersales"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql://agent:agent@db:5432/aftersales
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/code/app          # 开发热更新
      - ./knowledge:/code/knowledge      # 知识库语料
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      # 服务端渲染容器内访问 backend，浏览器走 next.config 代理
      BACKEND_URL: http://backend:8000
    depends_on:
      - backend

volumes:
  pgdata:
